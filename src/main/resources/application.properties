# Nom de l'application
spring.application.name=tp-foyer

# Configuration MySQL
spring.datasource.url=jdbc:mysql://tp-foyer-mysql:3306/tpfoyerdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# Afficher les requêtes SQL dans les logs
spring.jpa.show-sql=true

# Hibernate auto-update
spring.jpa.hibernate.ddl-auto=update

# Port du serveur Spring Boot à l'intérieur du container
server.port=8080
